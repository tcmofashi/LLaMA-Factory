# API Configuration
# 标准化的多Provider配置，支持RPM负载均衡

[agent]
max_retries = 5  # 最大重试次数
retry_base_delay = 2  # 重试基础延迟（秒）
load_balancing = "weighted"  # 负载均衡策略: weighted(按RPM权重), round_robin(轮询)

# Provider配置
[providers.primary]
name = "rinkoai"
model = "zai-org/GLM-4.7"
api_key = "sk-0QESf6Fx5LNzZmj0VpWU4kgljSOJnuxObJkngPEx2lNQkBxu"
base_url = "https://rinkoai.com/v1"
rpm = 60  # 每分钟请求数限制（Requests Per Minute）
timeout = 300  # 超时时间（秒）

[providers.fallback]
name = "rinkoai"
model = "zai-org/GLM-4.7"
api_key = "sk-0QESf6Fx5LNzZmj0VpWU4kgljSOJnuxObJkngPEx2lNQkBxu"
base_url = "https://rinkoai.com/v1"
rpm = 60  # 硅基流动通常有更高的速率限制
timeout = 300

[providers.deepseek]
name = "siliconflow"
